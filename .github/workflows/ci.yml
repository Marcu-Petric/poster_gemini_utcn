name: Build Poster

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile LaTeX poster
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install TeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            latexmk \
            lmodern \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-luatex

      - name: Compile poster
        run: latexmk -pdflatex='lualatex -interaction nonstopmode' -pdf poster.tex

      - name: Upload poster PDF
        uses: actions/upload-artifact@v4
        with:
          name: poster-pdf
          path: poster.pdf
