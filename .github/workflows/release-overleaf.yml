name: Release Overleaf bundle

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Overleaf ZIP
        run: bash scripts/package-overleaf.sh

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/overleaf-template.zip
          generate_release_notes: true
